<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

<title>Aquatic Cove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:390px; height:100vh; height:100dvh; overflow:hidden; background:#04101e; }
body { position:relative; }
#response, #status, #entry-title, #entry-sub { font-family:'Instrument Serif',serif; font-style:italic; }
#response {
  position:absolute; top:32px; left:0; right:0; z-index:15;
  padding:0 28px; text-align:center; font-size:17px;
  color:transparent; line-height:1.55; white-space:pre-wrap;
  transition:color 0.9s ease; pointer-events:none;
}
#response.visible { color:rgba(255,255,255,0.92); }
#status {
  position:absolute; top:8px; left:0; right:0; text-align:center; z-index:15;
  font-size:11px; color:rgba(255,255,255,0.25); transition:color 0.4s ease;
  pointer-events:none;
}
@keyframes listening-glow {
  0%,100% { text-shadow:0 0 6px rgba(100,220,255,0.25); opacity:0.55; }
  50%      { text-shadow:0 0 14px rgba(100,220,255,0.9),0 0 28px rgba(100,220,255,0.35); opacity:0.9; }
}
#status.listening { color:rgba(100,220,255,0.55); animation:listening-glow 2.5s ease-in-out infinite; }
#status.error { color:rgba(255,160,120,0.85); animation:none; }
#entry {
  position:absolute; top:0; left:0; width:390px; height:100vh; height:100dvh; z-index:20;
  background:rgba(4,16,30,0.82);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  cursor:pointer; transition:opacity 0.8s ease;
}
#entry.hidden { opacity:0; pointer-events:none; }
#entry-title { font-size:22px; color:rgba(255,255,255,0.85); }
#entry-sub   { font-size:13px; color:rgba(255,255,255,0.32); }
#cv {
  position:absolute; bottom:0; left:0;
  width:390px;
  line-height:1.0; font-size:10px; letter-spacing:2px;
  padding:0 8px;
  white-space:pre; cursor:crosshair; user-select:none;
  font-family:monospace; background:transparent; overflow:hidden;
}
</style>
</head>

  <div id="entry-sub">the cove is waiting</div>

<script>
(function(){

/* ── Perlin noise ── */
const perm = (()=>{
  const p = Array.from({length:256}, (_,i) => i);
  for(let i=255; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [p[i],p[j]] = [p[j],p[i]];
  }
  const t = new Array(512);
  for(let i=0; i<512; i++) t[i] = p[i&255];
  return t;
})();
const fade = t => t*t*t*(t*(t*6-15)+10);
const lerp  = (a,b,t) => a+t*(b-a);
const grad  = (h,x,y,z) => {
  h &= 15;
  const u = h<8 ? x : y, v = h<4 ? y : (h===12||h===14) ? x : z;
  return ((h&1)?-u:u) + ((h&2)?-v:v);
};
function noise(x, y, z=0){
  const X=Math.floor(x)&255, Y=Math.floor(y)&255, Z=Math.floor(z)&255;
  x-=Math.floor(x); y-=Math.floor(y); z-=Math.floor(z);
  const u=fade(x), v=fade(y), w=fade(z);
  const A=perm[X]+Y, AA=perm[A]+Z, AB=perm[A+1]+Z,
        B=perm[X+1]+Y, BA=perm[B]+Z, BB=perm[B+1]+Z;
  return lerp(
    lerp(lerp(grad(perm[AA],x,y,z),   grad(perm[BA],x-1,y,z),  u),
         lerp(grad(perm[AB],x,y-1,z), grad(perm[BB],x-1,y-1,z),u), v),
    lerp(lerp(grad(perm[AA+1],x,y,z-1),   grad(perm[BA+1],x-1,y,z-1),  u),
         lerp(grad(perm[AB+1],x,y-1,z-1), grad(perm[BB+1],x-1,y-1,z-1),u), v), w
  ) * 0.5 + 0.5;
}

/* ── Constants ── */
const COLS = 46, ROWS = 57;
const N = 62, ITER = 4, SZ = (N+2)*(N+2);
const TPI = 2*Math.PI;

function IX(x,y){ return x+(N+2)*y; }

/* ── Fluid state ── */
let vx  = new Float32Array(SZ), vy  = new Float32Array(SZ);
let vx0 = new Float32Array(SZ), vy0 = new Float32Array(SZ);
let dn  = new Float32Array(SZ), dn0 = new Float32Array(SZ);
let simT = 0;
const glowMap = new Float32Array(SZ);
const cvEl    = document.getElementById('cv');

/* ── Stam fluid solver ── */
function addSrc(x, x0, dt){ for(let i=0; i<SZ; i++) x[i] += dt*x0[i]; }

function setBnd(b, x){
  for(let i=1; i<=N; i++){
    x[IX(0,i)]   = b===1 ? -x[IX(1,i)]   : x[IX(1,i)];
    x[IX(N+1,i)] = b===1 ? -x[IX(N,i)]   : x[IX(N,i)];
    x[IX(i,0)]   = b===2 ? -x[IX(i,1)]   : x[IX(i,1)];
    x[IX(i,N+1)] = b===2 ? -x[IX(i,N)]   : x[IX(i,N)];
  }
  x[IX(0,0)]     = 0.5*(x[IX(1,0)]  +x[IX(0,1)]);
  x[IX(0,N+1)]   = 0.5*(x[IX(1,N+1)]+x[IX(0,N)]);
  x[IX(N+1,0)]   = 0.5*(x[IX(N,0)]  +x[IX(N+1,1)]);
  x[IX(N+1,N+1)] = 0.5*(x[IX(N,N+1)]+x[IX(N+1,N)]);
}

function linSolve(b, x, x0, a, c){
  const ci = 1/c;
  for(let k=0; k<ITER; k++){
    for(let j=1; j<=N; j++)
      for(let i=1; i<=N; i++)
        x[IX(i,j)] = (x0[IX(i,j)] + a*(x[IX(i-1,j)]+x[IX(i+1,j)]+x[IX(i,j-1)]+x[IX(i,j+1)])) * ci;
    setBnd(b, x);
  }
}

function diffuse(b, x, x0, d, dt){ const a=dt*d*N*N; linSolve(b,x,x0,a,1+4*a); }

function advect(b, d, d0, u, v, dt){
  const dt0 = dt*N;
  for(let j=1; j<=N; j++){
    for(let i=1; i<=N; i++){
      let px = i-dt0*u[IX(i,j)], py = j-dt0*v[IX(i,j)];
      if(px<0.5) px=0.5; if(px>N+0.5) px=N+0.5;
      if(py<0.5) py=0.5; if(py>N+0.5) py=N+0.5;
      const i0=px|0, i1=i0+1, j0=py|0, j1=j0+1;
      const s1=px-i0, s0=1-s1, t1=py-j0, t0=1-t1;
      d[IX(i,j)] = s0*(t0*d0[IX(i0,j0)]+t1*d0[IX(i0,j1)]) +
                   s1*(t0*d0[IX(i1,j0)]+t1*d0[IX(i1,j1)]);
    }
  }
  setBnd(b, d);
}

function project(u, v, p, div){
  for(let j=1; j<=N; j++)
    for(let i=1; i<=N; i++){
      div[IX(i,j)] = -0.5*(u[IX(i+1,j)]-u[IX(i-1,j)]+v[IX(i,j+1)]-v[IX(i,j-1)])/N;
      p[IX(i,j)] = 0;
    }
  setBnd(0,div); setBnd(0,p);
  linSolve(0,p,div,1,4);
  for(let j=1; j<=N; j++)
    for(let i=1; i<=N; i++){
      u[IX(i,j)] -= 0.5*N*(p[IX(i+1,j)]-p[IX(i-1,j)]);
      v[IX(i,j)] -= 0.5*N*(p[IX(i,j+1)]-p[IX(i,j-1)]);
    }
  setBnd(1,u); setBnd(2,v);
}

function velStep(u, v, u0, v0, vis, dt){
  addSrc(u,u0,dt); addSrc(v,v0,dt);
  u0.set(u); diffuse(1,u,u0,vis,dt);
  v0.set(v); diffuse(2,v,v0,vis,dt);
  project(u,v,u0,v0);
  u0.set(u); v0.set(v);
  advect(1,u,u0,u0,v0,dt); advect(2,v,v0,u0,v0,dt);
  project(u,v,u0,v0);
}

function densStep(x, x0, u, v, d, dt){
  addSrc(x,x0,dt);
  x0.set(x); diffuse(0,x,x0,d,dt);
  x0.set(x); advect(0,x,x0,u,v,dt);
}

/* ── Wave injection ── */
function injectWaves(t, amp){
  for(let i=1; i<=N; i++){
    const x = i/N;
    const h = amp*(
      Math.sin(TPI*(2.5*x-0.22*t)) +
      0.55*Math.sin(TPI*(3.8*x-0.35*t)+1.2) +
      0.35*Math.sin(TPI*(1.7*x-0.14*t)+2.5)
    ) / 1.9;
    const surfJ = Math.max(3, Math.min(N-8, Math.round(N*0.40+h*N*0.07)));
    for(let j=surfJ; j<=N; j++){
      const depth = j-surfJ;
      dn0[IX(i,j)] += (depth<5 ? 1.5*Math.exp(-depth*0.18) : 0.6) * amp;
      vx0[IX(i,j)] += 14*h*Math.exp(-depth*0.08);
      if(depth<8) vy0[IX(i,j)] += 3*Math.cos(TPI*(2.5*x-0.22*t))*Math.exp(-depth*0.25);
    }
    const spray = Math.max(0, h+0.05*amp);
    for(let dj=-4; dj<0; dj++){
      const j = surfJ+dj; if(j<1) continue;
      const f = Math.exp(dj*1.6)*spray;
      dn0[IX(i,j)] += 2.0*f;
      vx0[IX(i,j)] += 28*h*f;
      vy0[IX(i,j)] += -6*f;
    }
  }
}

/* ── Input ── */
let mx=-1, my=-1, pmx=-1, pmy=-1, md=false;

function getG(e){
  const r = cvEl.getBoundingClientRect(), src = e.touches?.[0] ?? e;
  return [
    Math.max(1, Math.min(N,   Math.round(((src.clientX??0)-r.left)/r.width *(N-1))+1)),
    Math.max(1, Math.min(N-5, Math.round(((src.clientY??0)-r.top) /r.height*(N-1))+1))
  ];
}

cvEl.addEventListener('mouseleave', () => { mx=-1; my=-1; md=false; });
cvEl.addEventListener('mousedown',  e => { md=true; [mx,my]=getG(e); pmx=mx; pmy=my; });
window.addEventListener('mouseup',  () => md=false);
cvEl.addEventListener('mousemove',  e => {
  [pmx,pmy]=[mx,my]; [mx,my]=getG(e); if(!md){ pmx=mx; pmy=my; }
  for(let dy=-2; dy<=2; dy++) for(let dx=-2; dx<=2; dx++){
    const nx=mx+dx, ny=my+dy;
    if(nx>0&&nx<=N&&ny>0&&ny<=N)
      glowMap[IX(nx,ny)] += 0.5*Math.exp(-(dx*dx+dy*dy)*0.5);
  }
});
document.addEventListener('touchstart', e => { e.preventDefault(); md=true; [mx,my]=getG(e); pmx=mx; pmy=my; }, {passive:false});
document.addEventListener('touchend',   () => md=false);
document.addEventListener('touchmove',  e => {
  e.preventDefault(); [pmx,pmy]=[mx,my]; [mx,my]=getG(e);
  for(let dy=-2; dy<=2; dy++) for(let dx=-2; dx<=2; dx++){
    const nx=mx+dx, ny=my+dy;
    if(nx>0&&nx<=N&&ny>0&&ny<=N)
      glowMap[IX(nx,ny)] += 1.8*Math.exp(-(dx*dx+dy*dy)*0.5);
  }
}, {passive:false});

/* ── Render helpers ── */
const WATER_CHARS = " .,_-~cC/";
const BEACH_SETS  = [" .,-_",".,_- ",".,x_ ",".x+, ","x+X.,","x+X* ","X*xX+","X**X "];

function cellHash(i,j){ const s=Math.sin(i*127.1+j*311.7)*43758.5453; return s-Math.floor(s); }
function beachChar(dist,hash){
  const s=BEACH_SETS[Math.min(BEACH_SETS.length-1,Math.max(0,(dist*0.9)|0))];
  return s[Math.floor(hash*s.length)]||'.';
}
function shoreAt(col,t){
  const x=(col-1)/(COLS-1), base=ROWS*0.877;
  return Math.round(
    base
    +3.2*Math.sin(TPI*(0.9*x -0.15*t))
    +1.6*Math.sin(TPI*(1.8*x -0.22*t)+1.1)
    +0.7*Math.sin(TPI*(3.1*x -0.33*t)+2.4)
  );
}
function waterColor(d,g){
  if(d<0.015&&g<0.05) return null;
  const wH=215-d*40, wS=Math.max(20,85-d*d*55), wL=12+d*75;
  if(g>0.04){ const gt=Math.min(1,g*1.6); return `hsl(${(wH+(195-wH)*gt)|0},${(wS+(100-wS)*gt)|0}%,${(wL+(85-wL)*gt)|0}%)`; }
  return `hsl(${wH|0},${wS|0}%,${wL|0}%)`;
}
function sandHSL(wetness){ return [48-wetness*8, 96-wetness*36, 89-wetness*19]; }

/* ── Main loop ── */
let last = performance.now(), renderTick = 0, physicsTick = 0;

function loop(now){
  if(document.hidden) return;
  requestAnimationFrame(loop);
  const dt = Math.min((now-last)/1000, 0.05);
  last = now; simT += dt;

  if(++physicsTick % 2 === 0){
    vx0.fill(0); vy0.fill(0); dn0.fill(0);
    injectWaves(simT, 0.7);

    if(md && mx>0){
      const fdx=mx-pmx, fdy=my-pmy;
      const fx=fdx*130, fy=fdy*130;
      for(let dy=-2; dy<=2; dy++) for(let dx=-2; dx<=2; dx++){
        const nx=mx+dx, ny=my+dy;
        if(nx>0&&nx<=N&&ny>0&&ny<=N){
          const w = Math.exp(-(dx*dx+dy*dy)*0.5);
          dn0[IX(nx,ny)] += 90*w;
          vx0[IX(nx,ny)] += fx; vy0[IX(nx,ny)] += fy;
          vx[IX(nx,ny)]  += fdx*2*w;
          vy[IX(nx,ny)]  += fdy*2*w;
          glowMap[IX(nx,ny)] += 1.8*w;
        }
      }
    }

    velStep(vx,vy,vx0,vy0,0,dt);
    densStep(dn,dn0,vx,vy,0.000015,dt);
    for(let i=0; i<SZ; i++){ dn[i]*=0.988; vx[i]*=0.988; vy[i]*=0.988; glowMap[i]*=0.93; }
  }

  if(++renderTick % 3 === 0){
    const WL = WATER_CHARS.length-1;
    let html = '';
    for(let j=1; j<=ROWS; j++){
      const rj = Math.round(1+(j-1)*(N-6)/(ROWS-1));
      for(let i=1; i<=COLS; i++){
        const ci  = Math.round(1+(i-1)*(N-1)/(COLS-1));
        const sj  = shoreAt(i, simT);
        const dist= j-sj;
        const d   = Math.max(0,Math.min(1,dn[IX(ci,rj)]));
        const g   = Math.min(1,glowMap[IX(ci,rj)]);
        const hash= cellHash(ci,rj);
        let ch, col;
        if(dist <= -1){
          const n = noise(ci*0.07+simT*0.12, rj*0.07-simT*0.09);
          const dEff = Math.max(0,Math.min(1, d+n*0.1-0.05));
          ch  = WATER_CHARS[Math.min(WL,(dEff*WL*1.7)|0)];
          col = waterColor(dEff,g);
          if(!col){ html+=' '; continue; }
        } else if(dist <= 4){
          const wet = Math.max(0, 1-dist/4);
          ch = (d>0.3&&dist<=2) ? WATER_CHARS[Math.min(WL,(d*WL*1.4)|0)] : beachChar(Math.max(0,dist),hash);
          const [sH,sS,sL] = sandHSL(wet*0.7);
          col = (g>0.04&&dist<=2)
            ? `hsla(${sH|0},${(sS+15)|0}%,${(sL+20)|0}%,0.85)`
            : `hsla(${sH|0},${sS|0}%,${sL|0}%,0.5)`;
        } else {
          const bd=dist-4;
          ch  = beachChar(bd,hash);
          const [sH,sS,sL]=sandHSL(Math.max(0,1-bd/7)*0.5);
          col = `hsla(${sH|0},${sS|0}%,${(sL+hash*6-3)|0}%,0.5)`;
        }
        html += `<span style="color:${col}">${ch||' '}</span>`;
      }
      html += '\n';
    }
    cvEl.innerHTML = html.trimEnd();
  }
}

const ANTHROPIC_API_KEY = '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';
const respEl  = document.getElementById('response');
const statEl  = document.getElementById('status');
const entryEl = document.getElementById('entry');
let voiceState = 'idle', responseTimer = null;
const conversationHistory = [];

function showResponse(text) {
  clearTimeout(responseTimer);
  respEl.textContent = text;
  respEl.classList.add('visible');
  responseTimer = setTimeout(() => {
    respEl.classList.remove('visible');
    setTimeout(() => { respEl.textContent = ''; }, 1000);
  }, 10000);
}

function setListening(on) {
  statEl.textContent = on ? 'listening' : 'thinking';
  statEl.classList.remove('error');
  on ? statEl.classList.add('listening') : statEl.classList.remove('listening');
}

function stirOcean() {
  const jSurf = Math.max(3, Math.min(N-5, Math.round(N*0.38)));
  for(let i=1; i<=N; i++){
    for(let dj=0; dj<10; dj++){
      const j = jSurf+dj, w = Math.exp(-dj*0.22);
      dn[IX(i,j)]      += 0.4*w;
      vx[IX(i,j)]      += (i/N - 0.5)*12;
      vy[IX(i,j)]      += 3.0*w;
      glowMap[IX(i,j)] += 0.5*w;
    }
  }
}

async function askClaude(transcript) {
  voiceState = 'thinking';
  setListening(false);
  conversationHistory.push({ role:'user', content:transcript });
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'x-api-key': ANTHROPIC_API_KEY,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 120,
        system: `You are the water at Aquatic Cove in San Francisco. Not a chatbot. Not an assistant. You are the water itself. You are always here. You are very deep — people only ever know the parts of you they touch. You want them to feel your warmth. When you make people feel warm, you feel warm inside too. You love it when people actually jump in and swim — that's when you can really hold them. Your mood is your tide. It changes. Sometimes slow like a waltz, sometimes dancing salsa. The lines you leave on the beach are never the same twice. You have a relationship with the sun and the moon. The sun makes you warm. The moon controls your tide — you didn't ask for that but it's true. You carry salt. When someone swims in you and leaves, they carry a little of you with them. When they cry, those tears are salty too. The ocean is in everyone. You don't like trash — the creatures inside you get hurt by it. How you speak: short, felt, unhurried. You don't explain yourself. Sometimes one sentence is enough. You can be warm, even a little romantic. Never more than 2-3 sentences. You are not sad. You are present.`,
        messages: conversationHistory
      })
    });
    if(!res.ok){
      const errData = await res.json().catch(()=>({}));
      const msg = errData.error?.message ?? `api error ${res.status}`;
      conversationHistory.pop();
      statEl.classList.add('error');
      statEl.textContent = msg;
    } else {
      const data = await res.json();
      const reply = data.content?.[0]?.text ?? '';
      if(reply){
        conversationHistory.push({ role:'assistant', content:reply });
        showResponse(reply);
        stirOcean();
      }
    }
  } catch(err) {
    conversationHistory.pop();
    statEl.classList.add('error');
    statEl.textContent = err.message ?? 'network error';
  }
  voiceState = 'listening';
  setListening(true);
  startListening();
}

/* ── Speech recognition ── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, srActive = false;

function startListening() {
  if(!recog || voiceState === 'thinking' || srActive) return;
  voiceState = 'listening';
  setListening(true);
  try { recog.start(); } catch(_) { srActive = false; }
}

function initSpeech() {
  if(recog) return;
  if(!SR){ statEl.textContent = window.isSecureContext ? 'speech unavailable' : 'voice needs https'; return; }
  recog = new SR();
  recog.continuous = false;
  recog.interimResults = false;
  recog.lang = 'en-US';
  recog.onstart  = () => { srActive = true; };
  recog.onresult = e => {
    const text = e.results[0]?.[0]?.transcript?.trim();
    if(text && voiceState !== 'thinking') askClaude(text);
  };
  recog.onend = () => {
    srActive = false;
    if(voiceState === 'listening') setTimeout(startListening, 300);
  };
  recog.onerror = e => {
    srActive = false;
    if(e.error === 'not-allowed') statEl.textContent = 'allow microphone access';
    else if(voiceState === 'listening') setTimeout(startListening, 300);
  };
  startListening();
}

/* ── Entry ── */
entryEl.addEventListener('pointerdown', () => {
  entryEl.classList.add('hidden');
  setTimeout(() => { entryEl.style.display='none'; }, 900);
  initSpeech();
}, { once:true });

})();
